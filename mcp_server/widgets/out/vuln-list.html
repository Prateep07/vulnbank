<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VulnBank — OWASP Top 10</title>

    <style>
        :root {
            color-scheme: light dark;
            --bg: #ffffff;
            --card: #f7f7f8;
            --border: #e5e5e5;
            --text: #171717;
            --muted: #6b7280;
            --accent: #2563eb;
        }

        html[data-theme="dark"] {
            --bg: #171717;
            --card: #222222;
            --border: #3a3a3a;
            --text: #f5f5f5;
            --muted: #a1a1aa;
            --accent: #60a5fa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: var(--bg);
            color: var(--text);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 24px;
            font-weight: 700;
        }

        .meta {
            margin-bottom: 20px;
            color: var(--muted);
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
        }

        .vuln-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .vuln-id {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            height: 30px;
            padding: 0 8px;
            border-radius: 7px;
            background: var(--accent);
            color: white;
            font-size: 12px;
            font-weight: 700;
        }

        .vuln-name {
            font-size: 14px;
            font-weight: 600;
        }

        .error {
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--muted);
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>VulnBank &mdash; OWASP Top 10 coverage</h1>

        <div class="meta" id="meta">
            Loading&hellip;
        </div>

        <div class="grid" id="grid"></div>

    </div>

    <script type="application/json" id="nitrostack-tool-data">null</script>

    <script>
        /*
         * ------------------------------------------------------------
         * VulnBank MCP Apps / NitroStack widget bridge
         * ------------------------------------------------------------
         */

        window.openai = window.openai || {};

        var rpcId = 1;
        var initId = null;
        var pending = {};

        /*
         * Send JSON-RPC messages to the MCP Apps host.
         */
        function postToHost(message) {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage(message, "*");
            }
        }

        /*
         * Send an RPC request to the host.
         */
        function rpc(method, params) {
            var id = rpcId++;

            return new Promise(function(resolve, reject) {

                pending[id] = {
                    resolve: resolve,
                    reject: reject
                };

                postToHost({
                    jsonrpc: "2.0",
                    id: id,
                    method: method,
                    params: params || {}
                });

                setTimeout(function() {

                    if (pending[id]) {
                        delete pending[id];

                        reject(
                            new Error(
                                method + " timed out"
                            )
                        );
                    }

                }, 20000);
            });
        }

        /*
         * Apply host theme.
         */
        function applyTheme(context) {

            context = context || {};

            var theme =
                context.theme ||
                (window.openai && window.openai.theme) ||
                "";

            if (!theme) {
                return;
            }

            document.documentElement.setAttribute(
                "data-theme",
                theme
            );

            document.documentElement.style.colorScheme =
                theme;

            if (document.body) {
                document.body.setAttribute(
                    "data-theme",
                    theme
                );
            }
        }

        /*
         * Read data embedded directly inside the HTML.
         */
        function readEmbeddedData() {

            var element =
                document.getElementById(
                    "nitrostack-tool-data"
                );

            if (!element) {
                return null;
            }

            var raw =
                (element.textContent || "").trim();

            if (!raw || raw === "null") {
                return null;
            }

            try {
                return JSON.parse(raw);
            } catch (error) {
                console.error(
                    "Could not parse embedded tool data:",
                    error
                );

                return null;
            }
        }

        /*
         * Convert MCP content blocks into structured data.
         */
        function extractContentData(content) {

            if (!Array.isArray(content)) {
                return null;
            }

            for (var i = 0; i < content.length; i++) {

                var item = content[i];

                if (!item) {
                    continue;
                }

                /*
                 * MCP text content.
                 */
                if (
                    item.type === "text" &&
                    item.text
                ) {

                    try {
                        return JSON.parse(
                            item.text
                        );
                    } catch (error) {

                        console.warn(
                            "MCP text content was not JSON:",
                            item.text
                        );
                    }
                }

                /*
                 * JSON content.
                 */
                if (
                    item.type === "json" &&
                    item.json
                ) {
                    return item.json;
                }

                /*
                 * Some hosts use mimeType.
                 */
                if (
                    item.mimeType ===
                    "application/json" &&
                    item.text
                ) {

                    try {
                        return JSON.parse(
                            item.text
                        );
                    } catch (error) {
                        console.error(
                            "Could not parse JSON content:",
                            error
                        );
                    }
                }
            }

            return null;
        }

        /*
         * Extract the actual tool output from different
         * MCP Apps / OpenAI host formats.
         */
        function extractToolResult(value) {

            if (!value) {
                return null;
            }

            /*
             * Direct structuredContent.
             */
            if (
                value.structuredContent &&
                typeof value.structuredContent === "object"
            ) {
                return value.structuredContent;
            }

            /*
             * Some hosts wrap the result inside result.
             */
            if (value.result) {

                var resultData =
                    extractToolResult(
                        value.result
                    );

                if (resultData) {
                    return resultData;
                }
            }

            /*
             * MCP content array.
             */
            if (value.content) {

                var contentData =
                    extractContentData(
                        value.content
                    );

                if (contentData) {
                    return contentData;
                }
            }

            /*
             * contents instead of content.
             */
            if (value.contents) {

                var contentsData =
                    extractContentData(
                        value.contents
                    );

                if (contentsData) {
                    return contentsData;
                }
            }

            /*
             * If the object itself looks like the
             * VulnBank structured output.
             */
            if (
                typeof value === "object" &&
                !Array.isArray(value) &&
                Array.isArray(value.vulnerabilities)
            ) {
                return value;
            }

            return null;
        }

        /*
         * Render vulnerabilities.
         */
        window.__nitroWidgetRender = function(data) {

            console.log(
                "VulnBank widget data:",
                data
            );

            if (!data) {
                return;
            }

            var vulnerabilities =
                data.vulnerabilities || [];

            var meta =
                document.getElementById("meta");

            var grid =
                document.getElementById("grid");

            if (!meta || !grid) {
                return;
            }

            if (!Array.isArray(vulnerabilities)) {

                meta.textContent =
                    "Invalid vulnerability data.";

                grid.innerHTML = "";

                return;
            }

            if (vulnerabilities.length === 0) {

                meta.textContent =
                    "No vulnerabilities returned.";

                grid.innerHTML = "";

                return;
            }

            meta.textContent =
                vulnerabilities.length +
                " categories covered";

            grid.innerHTML = "";

            vulnerabilities.forEach(
                function(vulnerability) {

                    var card =
                        document.createElement(
                            "div"
                        );

                    card.className =
                        "vuln-card";

                    var id =
                        document.createElement(
                            "span"
                        );

                    id.className =
                        "vuln-id";

                    id.textContent =
                        vulnerability.id || "";

                    var name =
                        document.createElement(
                            "span"
                        );

                    name.className =
                        "vuln-name";

                    name.textContent =
                        vulnerability.name || "";

                    card.appendChild(id);
                    card.appendChild(name);

                    grid.appendChild(card);
                }
            );
        };

        /*
         * Try to read tool output from window.openai.
         */
        function applyOpenAIOutput() {

            var openai =
                window.openai || {};

            var output =
                openai.toolOutput ||
                openai.toolResult ||
                null;

            if (!output) {
                return false;
            }

            var data =
                extractToolResult(output);

            if (data) {

                window.__nitroWidgetRender(
                    data
                );

                return true;
            }

            return false;
        }

        /*
         * Read any tool data that may already be available.
         */
        function applyExistingData() {

            /*
             * OpenAI-style host.
             */
            if (applyOpenAIOutput()) {
                return true;
            }

            /*
             * Embedded NitroStack data.
             */
            var embedded =
                readEmbeddedData();

            if (embedded) {

                var data =
                    extractToolResult(
                        embedded
                    );

                if (data) {

                    window.__nitroWidgetRender(
                        data
                    );

                    return true;
                }
            }

            return false;
        }

        /*
         * Handle MCP Apps messages.
         */
        window.addEventListener(
            "message",
            function(event) {

                var message =
                    event.data;

                /*
                 * Some hosts may send JSON as a string.
                 */
                if (
                    typeof message === "string"
                ) {

                    try {
                        message =
                            JSON.parse(message);
                    } catch (error) {
                        return;
                    }
                }

                if (
                    !message ||
                    typeof message !== "object"
                ) {
                    return;
                }

                console.log(
                    "MCP Apps message:",
                    message
                );

                /*
                 * Handle JSON-RPC responses.
                 */
                if (
                    message.jsonrpc === "2.0" &&
                    message.id != null &&
                    pending[message.id]
                ) {

                    var request =
                        pending[message.id];

                    delete pending[message.id];

                    if (message.error) {

                        request.reject(
                            message.error
                        );

                    } else {

                        request.resolve(
                            message.result
                        );
                    }
                }

                /*
                 * MCP Apps initialize response.
                 */
                if (
                    message.jsonrpc === "2.0" &&
                    message.id === initId &&
                    message.result
                ) {

                    var hostContext =
                        message.result.hostContext ||
                        {};

                    window.openai =
                        Object.assign(
                            window.openai || {},
                            {
                                theme:
                                    hostContext.theme
                            }
                        );

                    applyTheme(
                        hostContext
                    );

                    /*
                     * Tell the host initialization
                     * is complete.
                     */
                    postToHost({
                        jsonrpc: "2.0",
                        method:
                            "ui/notifications/initialized"
                    });

                    return;
                }

                /*
                 * MCP Apps tool result.
                 *
                 * This is the important part for
                 * MCP Inspector / MCP Apps.
                 */
                if (
                    message.jsonrpc === "2.0" &&
                    message.method ===
                        "ui/notifications/tool-result"
                ) {

                    var toolData =
                        extractToolResult(
                            message.params || {}
                        );

                    if (toolData) {

                        window.__nitroWidgetRender(
                            toolData
                        );
                    }

                    return;
                }

                /*
                 * Some hosts use the older
                 * notifications/tool-result name.
                 */
                if (
                    message.jsonrpc === "2.0" &&
                    message.method ===
                        "notifications/tool-result"
                ) {

                    var oldToolData =
                        extractToolResult(
                            message.params || {}
                        );

                    if (oldToolData) {

                        window.__nitroWidgetRender(
                            oldToolData
                        );
                    }

                    return;
                }

                /*
                 * Support setGlobals messages.
                 */
                if (
                    message.type === "setGlobals" &&
                    message.globals
                ) {

                    window.openai =
                        Object.assign(
                            window.openai || {},
                            message.globals
                        );

                    applyTheme(
                        message.globals
                    );

                    applyOpenAIOutput();

                    return;
                }

                /*
                 * Support toolOutput-style hosts.
                 */
                if (
                    message.type === "toolOutput"
                ) {

                    var outputData =
                        extractToolResult(
                            message.data ||
                            message.output ||
                            message.result
                        );

                    if (outputData) {

                        window.__nitroWidgetRender(
                            outputData
                        );
                    }

                    return;
                }

                /*
                 * Host context changed.
                 */
                if (
                    message.jsonrpc === "2.0" &&
                    message.method ===
                        "ui/notifications/host-context-changed"
                ) {

                    applyTheme(
                        message.params || {}
                    );

                    return;
                }
            }
        );

        /*
         * Start MCP Apps initialization.
         */
        function startMcpAppsHandshake() {

            initId = rpcId++;

            postToHost({

                jsonrpc: "2.0",

                id: initId,

                method: "ui/initialize",

                params: {

                    protocolVersion:
                        "2026-01-26",

                    appInfo: {

                        name:
                            "vulnbank-widget",

                        version:
                            "1.0.0"
                    },

                    appCapabilities: {

                        availableDisplayModes: [
                            "inline",
                            "fullscreen",
                            "pip"
                        ]
                    }
                }
            });
        }

        /*
         * Listen for OpenAI host globals.
         */
        window.addEventListener(
            "openai:set_globals",
            function(event) {

                var globals =
                    (
                        event &&
                        event.detail &&
                        event.detail.globals
                    ) || {};

                window.openai =
                    Object.assign(
                        window.openai || {},
                        globals
                    );

                applyTheme(
                    globals
                );

                applyOpenAIOutput();
            }
        );

        /*
         * OpenAI host ready event.
         */
        window.addEventListener(
            "openai:ready",
            function() {

                applyTheme(
                    window.openai || {}
                );

                applyOpenAIOutput();
            }
        );

        /*
         * Initialize the widget.
         */
        startMcpAppsHandshake();

        /*
         * Apply anything that is already available.
         */
        applyExistingData();

        /*
         * Poll briefly because some hosts expose
         * toolOutput after iframe initialization.
         */
        var attempts = 0;

        var poll =
            setInterval(
                function() {

                    applyExistingData();

                    attempts++;

                    if (attempts > 40) {
                        clearInterval(poll);
                    }

                },
                250
            );
    </script>
</body>
</html>
